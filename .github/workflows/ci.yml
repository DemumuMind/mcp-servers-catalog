name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: file:.turso/ci-test.db

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          AUTH_SECRET: test-secret-for-ci-build-only
          NEXTAUTH_SECRET: test-secret-for-ci-build-only

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push
      - run: npm run test:unit
        env:
          AUTH_SECRET: test-secret-for-ci-unit-only
          NEXTAUTH_SECRET: test-secret-for-ci-unit-only

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run db:push
      - run: npm run db:seed
        env:
          AUTH_SECRET: test-secret-for-e2e-only
          NEXTAUTH_SECRET: test-secret-for-e2e-only
          ADMIN_PASSWORD: admin123
          ADMIN_EMAIL: admin@example.com
          CRON_SECRET: test-cron-secret
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          AUTH_SECRET: test-secret-for-e2e-only
          NEXTAUTH_SECRET: test-secret-for-e2e-only
          ADMIN_PASSWORD: admin123
          ADMIN_EMAIL: admin@example.com
          CRON_SECRET: test-cron-secret
