name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npm run build
        env:
          AUTH_SECRET: test-secret-for-ci-build-only
          NEXTAUTH_SECRET: test-secret-for-ci-build-only
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite

  test-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npm run test:unit

  test-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://localhost:5432/test
          DATABASE_DIR: .pglite
      - run: npm run db:init
        env:
          DATABASE_DIR: .pglite3
      - run: npm run db:seed
        env:
          AUTH_SECRET: test-secret-for-e2e-only
          NEXTAUTH_SECRET: test-secret-for-e2e-only
          DATABASE_DIR: .pglite3
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin123
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          AUTH_SECRET: test-secret-for-e2e-only
          NEXTAUTH_SECRET: test-secret-for-e2e-only
          DATABASE_DIR: .pglite3
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin123
